<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Coverage App</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>Team Coverage</h1>
  </header>

  <main>
    <section id="controls">
      <label for="role">Role</label>
      <select id="role">
        <option value="">Select a role…</option>
        <option value="installer">Installer</option>
        <option value="surveyor">Surveyor</option>
      </select>

      <label for="postcode">Customer postcode</label>
      <input id="postcode" type="text" placeholder="e.g. SW1A 1AA" />
      <span id="postcode-error" class="error" hidden></span>

      <button id="search-btn">Find teams</button>
    </section>

    <section id="results" hidden>
      <div id="team-list"></div>
      <div id="map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
